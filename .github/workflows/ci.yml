name: Test and publish Task API
on:
  push:
    branches: [main, Week-5-Content]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested image to the configured server
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: start/Task Management API
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: taskapi_ci
          POSTGRES_DB: taskapi_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U taskapi -d taskapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskapi:taskapi_ci@localhost:5432/taskapi_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: start/Task Management API/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./start/Task Management API
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/madoxhankins-lang/taskapi:latest,ghcr.io/madoxhankins-lang/taskapi:${{ github.sha }}
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      IMAGE: ghcr.io/madoxhankins-lang/taskapi:${{ github.sha }}
    steps:
      - name: Pull and start tested image
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/taskapi && export TASK_API_IMAGE='$IMAGE' && docker compose pull api && docker compose up -d --no-build --wait"
