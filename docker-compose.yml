name: wd2200-taskapi
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi_local
      POSTGRES_DB: taskapi
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d taskapi"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6385:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: ${TASK_API_IMAGE:-wd2200-taskapi:local}
    build:
      context: ./start/Task Management API
    env_file: ./start/Task Management API/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskapi:taskapi_local@postgres:5432/taskapi?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3005
    ports: ["127.0.0.1:3005:3005"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
